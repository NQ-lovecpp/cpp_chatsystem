server {
  listen 10010;
  listen [::]:10010;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: 所有未命中的路径都回退到 index.html，让前端路由接管
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 后端 C++ Gateway HTTP（28 个 /service/* 接口）
  location /service/ {
    proxy_pass http://gateway_server:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 100m;          # 文件上传
  }

  # 后端 C++ Gateway WebSocket
  location /ws {
    proxy_pass http://gateway_server:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Agent Server（FastAPI HTTP + SSE）
  location /agent/ {
    proxy_pass http://agent_server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;                # SSE 必须关闭 buffering
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
